# Revision: 0.00.000
en:
  label_gk_compat_about: "About the plugin"
  label_gk_compat_changelog: "Change log"
  text_gk_compat_changelog_english: "The change log is always written in English."
  text_gk_compat_description: "Connects every GK plugin that needs it to Redmine in the same way, whatever version of Redmine runs. The plugin is a layer between the plugins and Redmine: in some cases it mends Redmine backwards, for instance by supplying the colour variables an older version lacks, and in others it tells the plugins how to behave, for instance whether Redmine asks for the password again before administrative pages."
  label_gk_compat_instance: "This instance"
  label_gk_compat_abilities: "Adaptations per version"
  label_gk_compat_running: "This instance runs:"
  label_gk_compat_file: "Version file in use:"
  label_gk_compat_ability: "Adaptation"
  text_gk_compat_shim_missing_icons: "Draws the icons an older version shows as bare text, Add for subtasks and relations, for plugins that show a page's links as icons."
  label_gk_compat_shim: "shim"
  label_gk_compat_missing: "missing"
  label_gk_compat_fills: "Colour variables (--oc-*):"
  text_gk_compat_fills_yes: "core lacks them here, compat supplies them (Open Color 1.9.1)."
  text_gk_compat_fills_no: "core has them itself, compat supplies nothing."
  text_gk_compat_unknown: "Redmine %{series} has no version file in compat. The instance runs on the file for %{used}. Supported versions: %{supported}."
  text_gk_compat_ability_css_variables: "Core is drawn with CSS variables that a theme can set."
  text_gk_compat_ability_rtl_dir_attribute: "Core marks the reading direction with dir on the page and lays out with logical properties; otherwise it loads rtl.css."
  text_gk_compat_ability_icon_style: "sprite_icon takes style: (outline or filled) and a theme can carry its own icons."
  text_gk_compat_ability_raster_icon_classes: "Core's stylesheet still carries the old raster icons as classes (.icon-add and the rest)."
  text_gk_compat_ability_sudo_mode_by_default: "Core asks an administrator for the password again before administrative pages, unless configuration.yml says otherwise."
  label_gk_compat_backports: "Fixes from a newer core that compat puts in here:"
  text_gk_compat_since: "from %{release}"
  text_gk_compat_ability_bulk_status_callbacks: "Locking or unlocking several accounts at once saves account by account, so what follows the accounts (the account events) hears of it."
  text_gk_compat_ability_account_dropdown: "The account is a dropdown in the profile menu, where the account menu's rows are drawn; otherwise a row of links at the top with the name beside it (Logged in as)."
  text_gk_compat_ability_progressbar_field_format: "Custom fields can have the format Progress bar."
